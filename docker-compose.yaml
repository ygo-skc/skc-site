services:
  skc-site:
    image: nginx:stable-alpine
    ports:
      - 3000:80
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=1m,mode=0700,uid=1000,gid=1000
      - /run:size=64k,mode=0755,uid=1000,gid=1000
    command: [nginx, '-g', 'daemon off;']
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0 # lets the non-root master bind port 80 
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 20M
          cpus: '0.5'
          pids: 128
    memswap_limit: 20M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - skc
    labels:
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "nginx",
          "service": "skc-site"
        }]
      com.datadoghq.tags.env: 'dev'
      com.datadoghq.tags.service: 'skc-site'

networks:
  skc:
    name: skc
    driver: bridge
    external: true # network was alredy created, if you need to recreate the network - make this false
