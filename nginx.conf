server {
	listen 80;
	location / {
		root /usr/share/nginx/html;
		index index.html index.htm;
		try_files $uri $uri/ /index.html =404;
		# cache
		expires 5m;
	}

	# bundles have a hash of their content in their name, so a name never changes what it serves
	location ~* \.[0-9a-f]{8}\.js$ {
		root /usr/share/nginx/html;
		add_header Cache-Control 'public, max-age=31536000, immutable';
	}

	# index.html points at the newest bundles, so browsers check for a new one on every visit
	location = /index.html {
		root /usr/share/nginx/html;
		add_header Cache-Control 'no-cache';
	}

	location /health {
		access_log off;
		add_header 'Content-Type' 'text/plain';
		return 200 "healthy\n";
	}

	# compression
	gzip on;
	gzip_comp_level 4;
	gzip_vary on;
	gzip_min_length 10240;
	gzip_proxied any;
	gzip_types text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/x-javascript
		application/javascript
		application/xml
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		image/svg+xml
		font/opentype;
	gzip_disable "MSIE [1-6]\.";
}